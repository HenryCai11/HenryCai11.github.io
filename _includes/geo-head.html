<!-- GEO: machine-readable identity for search and answer engines -->
{% assign geo_url = page.url | replace: "index.html", "" | prepend: site.url %}
{% assign geo_title = site.name %}{% if page.title and page.title != "About" %}{% assign geo_title = page.title | append: " — " | append: site.name %}{% endif %}
<link rel="canonical" href="{{ geo_url }}">
<meta property="og:type" content="{% if page.url == "/" %}profile{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ geo_title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ geo_url }}">
<meta property="og:image" content="{{ site.url }}/images/profile.png">
<meta name="twitter:card" content="summary">

<meta name="twitter:description" content="{{ site.description }}">
